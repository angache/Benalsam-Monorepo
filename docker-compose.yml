

networks:
  benalsam-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
    driver_opts:
      com.docker.network.bridge.name: benalsam-bridge

volumes:
  redis-data:
    driver: local
  elasticsearch-data:
    driver: local

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      benalsam-network:
        ipv4_address: 172.18.0.2
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    networks:
      benalsam-network:
        ipv4_address: 172.18.0.3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  admin-backend:
    build:
      context: .
      dockerfile: ./packages/admin-backend/Dockerfile
      target: development
      cache_from:
        - benalsam-admin-backend:cache
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3002}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - ELASTICSEARCH_INDEX=${ELASTICSEARCH_INDEX:-benalsam_listings}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://admin.benalsam.com,https://benalsam.com,http://209.227.228.96:3003,http://209.227.228.96:5173}
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/admin-backend/node_modules
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: ["npm", "run", "dev"]
    networks:
      benalsam-network:
        ipv4_address: 172.18.0.4
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin-ui:
    build:
      context: .
      dockerfile: ./packages/admin-ui/Dockerfile
      target: development
      cache_from:
        - benalsam-admin-ui:cache
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3003}
      - VITE_API_URL=${VITE_API_URL:-https://benalsam.com/api/v1}
      - VITE_ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://admin.benalsam.com,https://benalsam.com,http://209.227.228.96:3003,http://209.227.228.96:5173}
    ports:
      - "3003:3003"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/admin-ui/node_modules
    depends_on:
      admin-backend:
        condition: service_healthy
    command: ["npm", "run", "dev"]
    networks:
      benalsam-network:
        ipv4_address: 172.18.0.5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: ./packages/web/Dockerfile
      target: development
      cache_from:
        - benalsam-web:cache
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-5173}
      - VITE_API_URL=${VITE_API_URL:-https://benalsam.com/api/v1}
      - VITE_ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://admin.benalsam.com,https://benalsam.com,http://209.227.228.96:3003,http://209.227.228.96:5173}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/web/node_modules
    depends_on:
      admin-backend:
        condition: service_healthy
    command: ["npm", "run", "dev"]
    networks:
      benalsam-network:
        ipv4_address: 172.18.0.6
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3" 